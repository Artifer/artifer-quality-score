[package]
name = "aqs"
version = "0.4.1"
edition = "2021"
rust-version = "1.80"
description = "Deterministic, explainable code quality scoring for Python, TypeScript and JavaScript"

[[bin]]
name = "aqs"
path = "src/main.rs"

[dependencies]
# Grammar pins are EXACT and match the Python reference implementation's wheels
# byte for byte. A grammar bump can rename AST nodes and silently change every
# score, so parity with the reference depends on these staying locked together.
tree-sitter = "0.26"
tree-sitter-python = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.23.1"

clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rayon = "1"
sha2 = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
regex = "1"
walkdir = "2"
anyhow = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
serde_json = "1"
