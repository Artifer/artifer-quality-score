# Checks that run on every push and pull request.
#
# Actions are pinned to a commit: a tag can be moved, and what this repository publishes
# is piped into a shell.
#
# The lock-file check exists because of a real failure: `v0.6.2` was tagged with
# `Cargo.toml` bumped but `Cargo.lock` still recording the previous version. The release
# workflow builds with `--locked`, so that tag could not be built at all — and nothing
# noticed until someone went looking for its binaries. A stale lock is now caught on the
# commit that introduces it, before a tag is ever pushed.

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update --component clippy --component rustfmt

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-llvm-cov
            target
          key: ci-${{ hashFiles('Cargo.lock', 'Makefile') }}

      # The checks are defined in the Makefile, not here: lock file in sync, rustfmt,
      # clippy, the tool's score of its own source (must be 10), and the tests at 100%
      # line and function coverage.
      - name: make check
        run: |
          make tools
          make check
