# Checks that run on every push and pull request.
#
# The lock-file check exists because of a real failure: `v0.6.2` was tagged with
# `Cargo.toml` bumped but `Cargo.lock` still recording the previous version. The release
# workflow builds with `--locked`, so that tag could not be built at all — and nothing
# noticed until someone went looking for its binaries. A stale lock is now caught on the
# commit that introduces it, before a tag is ever pushed.

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update --component clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-${{ hashFiles('Cargo.lock') }}

      # `--locked` here mirrors the release build. If this fails, run `cargo check` and
      # commit the resulting Cargo.lock.
      - name: Cargo.lock is in sync
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      # Dogfooding: the tool gates its own quality. The threshold is below the current
      # 10.00 so that an honest, explained regression is possible without editing CI in
      # the same commit — but a collapse still fails the build.
      - name: Score itself
        run: cargo run --release --locked -- scan . --min-score 9.5
