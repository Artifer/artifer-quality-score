[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artifer-quality-score"
version = "0.1.0"
description = "Deterministic, explainable code quality scoring for Python, TypeScript and JavaScript"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Grammar pins are EXACT, not ranges, and deliberately so: a grammar bump
    # can rename AST nodes and silently change every score in the repo. Treat
    # changing these as a scoring change that needs re-baselining.
    "tree-sitter==0.26.0",
    "tree-sitter-python==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-javascript==0.23.1",
    "typer>=0.20",
    "rich>=14",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
aqs = "aqs.cli:main"
artifer-quality-score = "aqs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aqs*"]

[tool.setuptools.package-data]
aqs = ["docs/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
